<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body class="site">
    <canvas id="dot-grid"></canvas>
    <div class="site-shell">
      <main class="site-main">
        {{ content }}
      </main>
    </div>
    <script>
    (function() {
      const canvas = document.getElementById('dot-grid');
      const ctx = canvas.getContext('2d');

      let width, height;
      let dots = [];
      let mouse = { x: -1000, y: -1000 };
      const SPACING = 32;
      const DOT_RADIUS = 1;
      const INFLUENCE_RADIUS = 120;
      const DOT_COLOR = 'rgba(255, 200, 64, 0.15)';

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        initDots();
      }

      function initDots() {
        dots = [];
        for (let x = SPACING; x < width; x += SPACING) {
          for (let y = SPACING; y < height; y += SPACING) {
            dots.push({ originX: x, originY: y, x: x, y: y });
          }
        }
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);

        for (const dot of dots) {
          const dx = mouse.x - dot.originX;
          const dy = mouse.y - dot.originY;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < INFLUENCE_RADIUS) {
            const force = (1 - dist / INFLUENCE_RADIUS) * 12;
            const angle = Math.atan2(dy, dx);
            dot.x = dot.originX - Math.cos(angle) * force;
            dot.y = dot.originY - Math.sin(angle) * force;
          } else {
            dot.x += (dot.originX - dot.x) * 0.1;
            dot.y += (dot.originY - dot.y) * 0.1;
          }

          ctx.beginPath();
          ctx.arc(dot.x, dot.y, DOT_RADIUS, 0, Math.PI * 2);
          ctx.fillStyle = DOT_COLOR;
          ctx.fill();
        }

        requestAnimationFrame(animate);
      }

      window.addEventListener('resize', resize);
      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });
      window.addEventListener('mouseleave', () => {
        mouse.x = -1000;
        mouse.y = -1000;
      });

      resize();
      animate();
    })();
    </script>
  </body>
</html>
