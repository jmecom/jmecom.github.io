<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body class="site">
    <canvas id="dot-grid"></canvas>
    <div class="pager-header">
      <span class="pager-tab">Jordan Mecom</span>
      <div class="pager-line"></div>
    </div>
    <div class="site-shell">
      <main class="site-main">
        {{ content }}
      </main>
    </div>
    <div class="pager-footer">
      <div class="pager-line-bottom"></div>
      <span class="pager-progress" id="scroll-progress">0%</span>
    </div>
    <script>
    (function() {
      const canvas = document.getElementById('dot-grid');
      const ctx = canvas.getContext('2d');

      let width, height;
      let dots = [];
      let mouse = { x: -1000, y: -1000 };
      const SPACING = 32;
      const DOT_RADIUS = 1;
      const INFLUENCE_RADIUS = 150;
      const BASE_COLOR = [186, 204, 212];
      const COLORS = [
        [245, 124, 108],
        [186, 204, 212],
        [200, 200, 190]
      ];

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        initDots();
      }

      function initDots() {
        dots = [];
        const offset = (width % SPACING) / 2;
        for (let x = offset; x < width; x += SPACING) {
          for (let y = 0; y < height; y += SPACING) {
            dots.push({ originX: x, originY: y, x: x, y: y });
          }
        }
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);

        for (const dot of dots) {
          const dx = mouse.x - dot.originX;
          const dy = mouse.y - dot.originY;
          const dist = Math.sqrt(dx * dx + dy * dy);

          let color, alpha;

          if (dist < INFLUENCE_RADIUS) {
            const t = 1 - dist / INFLUENCE_RADIUS;
            const force = t * 12;
            const angle = Math.atan2(dy, dx);
            dot.x = dot.originX - Math.cos(angle) * force;
            dot.y = dot.originY - Math.sin(angle) * force;

            color = COLORS[0]; // coral for entire hover area
            alpha = 0.2 + t * 0.5;
          } else {
            dot.x += (dot.originX - dot.x) * 0.1;
            dot.y += (dot.originY - dot.y) * 0.1;
            color = BASE_COLOR;
            alpha = 0.15;
          }

          ctx.beginPath();
          ctx.arc(dot.x, dot.y, DOT_RADIUS, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${alpha})`;
          ctx.fill();
        }

        requestAnimationFrame(animate);
      }

      window.addEventListener('resize', resize);
      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });
      window.addEventListener('mouseleave', () => {
        mouse.x = -1000;
        mouse.y = -1000;
      });

      resize();
      animate();
    })();

    // Scroll progress tracking
    (function() {
      const progress = document.getElementById('scroll-progress');
      window.addEventListener('scroll', () => {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const scrollPercent = docHeight > 0 ? Math.round((scrollTop / docHeight) * 100) : 0;
        progress.textContent = scrollPercent + '%';
      });
    })();

    // Typewriter effect - pre-render all text hidden, then reveal character by character
    (function() {
      const text = "I'm a Staff Security Engineer currently working at Block on bitcoin security. Previously, I wrote the firmware for Bitkey, secured self-driving cars at Waymo, and worked on hardware security for Square's payment terminals.\n\nMy work focuses on low-level systems, cryptography, and hardware.";
      const target = document.getElementById('typewriter-text');
      const cursor = document.querySelector('.cursor');
      if (!target) return;
      document.body.classList.add('typewriter-running');

      // Pre-render all characters as hidden spans
      const chars = [];
      const elements = []; // includes both spans and br elements for cursor positioning
      for (let j = 0; j < text.length; j++) {
        const char = text.charAt(j);
        if (char === '\n') {
          const br = document.createElement('br');
          target.appendChild(br);
          elements.push(br);
        } else {
          const span = document.createElement('span');
          span.textContent = char;
          span.style.opacity = '0';
          target.appendChild(span);
          chars.push(span);
          elements.push(span);
        }
      }

      // Move cursor to start position (before any text)
      target.insertBefore(cursor, target.firstChild);
      cursor.style.opacity = '1';

      let i = 0;
      let elementIndex = 0;
      const speed = 1;

      function reveal() {
        if (i < chars.length) {
          chars[i].style.opacity = '1';
          // Move cursor after the current element
          while (elementIndex < elements.length && elements[elementIndex] !== chars[i]) {
            elementIndex++;
          }
          if (elements[elementIndex + 1]) {
            target.insertBefore(cursor, elements[elementIndex + 1]);
          } else {
            target.appendChild(cursor);
          }
          i++;
          elementIndex++;
          setTimeout(reveal, speed);
        } else {
          cursor.classList.add('blink');
          document.body.classList.remove('typewriter-running');
          const socialRow = document.querySelector('.social-row');
          if (socialRow) socialRow.classList.add('visible');
        }
      }

      setTimeout(reveal, 500);
    })();

    </script>
  </body>
</html>
